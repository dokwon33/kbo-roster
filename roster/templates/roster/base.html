<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>{% block title %}KBO 선수단 관리{% endblock %}</title>
  <style>
    body { font-family: -apple-system, "Malgun Gothic", sans-serif; margin: 0; background: #f5f6f8; color: #1c1e21; }
    header { background: #14213d; color: #fff; padding: 14px 24px; }
    header a { color: #fff; text-decoration: none; font-weight: bold; }
    nav a { color: #cbd5e1; margin-left: 16px; text-decoration: none; font-size: 14px; }
    main { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .card h3 { margin-top: 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; font-size: 14px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
    .badge-active { background: #dcfce7; color: #166534; }
    .badge-optioned { background: #fef3c7; color: #92400e; }
    .badge-injured { background: #fee2e2; color: #991b1b; }
    .badge-other { background: #e5e7eb; color: #374151; }
    a.player-link { color: #14213d; text-decoration: none; }
    a.player-link:hover { text-decoration: underline; }
    header a.brand { display: inline-flex; align-items: center; gap: 8px; }
    header a.brand img { height: 22px; }
    .player-photo { width: 100%; max-width: 160px; border-radius: 8px; background: #e5e7eb; }
    .player-photo-sm { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; vertical-align: middle; margin-right: 6px; background: #e5e7eb; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="{% url 'roster:team_list' %}">
      <img src="https://6ptotvmi5753.edge.naverncp.com/KBO_IMAGE/KBOHome/resources/images/common/h1_logo.png" alt="KBO">
      선수단 관리
    </a>
    <nav>
      <a href="{% url 'roster:team_list' %}">구단별 현황</a>
      <a href="{% url 'roster:recent_events' %}">최근 변동</a>
      <a href="/admin/">관리자</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
